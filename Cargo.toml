[package]
name = "dhtcrawler"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
mongodb = "3"
sha1 = "0.11"
rand = "0.10"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[[bin]]
name = "dhtcrawler"
path = "src/main.rs"

[profile.release]
lto = true
